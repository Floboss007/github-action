name: web-ci

on:
  push:
    branches: [ main ]
 
jobs:
  build and test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: install docker
      uses: docker/setup-buildx-action@v2
      run: |
        sudo apt-get update
        sudo apt-get install docker.io -y
    - name: Build docker image and run tests
      run: |
        docker build -t my-image:latest .
        docker run my-image:latest -p 8080:80 --name web-test
    - name: Wait for server to boot up
      run: sleep 10

    - name: Verify HTML Content
      run: |
        # Fetch the page and check for a specific string
        curl -s http://localhost:8080 | grep -q "Hello"
        
    - name: Cleanup Container
      if: always()
      run: docker rm -f my-test-app
  Build and deploy:
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.RSA_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /tmp
            git clone ${{ secrets.REPO_URL }} my-app
            cd my-app
            docker build -t my-image:latest .
            docker stop web-container || true
            docker rm web-container || true
            docker run -d -p 8080:80 --name web-app my-image:latest




    

